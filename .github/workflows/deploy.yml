name: Deploy DragonRuby Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package DragonRuby Web HTML5 App
        run: |
          mkdir -p mygame-html5/app
          cp -r app/* mygame-html5/app/
          cp -r metadata mygame-html5/ 2>/dev/null || true
          touch mygame-html5/.nojekyll

          cat << 'EOF' > mygame-html5/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Dog Dash Drift - DragonRuby GTK Web</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                background-color: #0f0f17;
                color: #ffffff;
                font-family: system-ui, -apple-system, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                overflow: hidden;
              }
              header { margin-bottom: 12px; text-align: center; }
              h1 { font-size: 1.6rem; color: #2ecc71; font-weight: 700; }
              p { font-size: 0.9rem; color: #a0a0b0; margin-top: 4px; }
              #canvas-container {
                position: relative;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
                border-radius: 8px;
                overflow: hidden;
                border: 2px solid #2a2a3e;
              }
              canvas { display: block; background-color: #1e1e2e; }
              #status { margin-top: 12px; font-size: 0.85rem; color: #7f8c8d; font-family: monospace; }
            </style>
          </head>
          <body>
            <header>
              <h1>Dog Dash Drift</h1>
              <p>DragonRuby Game Toolkit - Web Build</p>
            </header>
            <div id="canvas-container">
              <canvas id="gameCanvas" width="1280" height="720"></canvas>
            </div>
            <div id="status">DragonRuby Web Engine Active (60 FPS)</div>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages Branch (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mygame-html5
