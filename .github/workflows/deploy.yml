name: Deploy DragonRuby Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package DragonRuby Native WebAssembly HTML5 App
        run: |
          mkdir -p mygame-html5
          cp -r html5/* mygame-html5/
          mkdir -p mygame-html5/gamedata/app
          cp -r app/* mygame-html5/gamedata/app/
          cp -r metadata mygame-html5/gamedata/ 2>/dev/null || true
          cp -r app mygame-html5/ 2>/dev/null || true
          cp -r metadata mygame-html5/ 2>/dev/null || true
          touch mygame-html5/.nojekyll

      - name: Deploy to GitHub Pages Branch (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mygame-html5
