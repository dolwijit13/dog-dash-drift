<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Dash Deluxe (DDD) - HTML5 Web Runner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #11111b;
      color: #cdd6f4;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    header {
      margin-bottom: 12px;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      color: #a6e3a1;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    p.subtitle {
      font-size: 14px;
      color: #a6adc8;
    }
    .canvas-container {
      position: relative;
      border: 3px solid #313244;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      background-color: #1e1e2e;
      overflow: hidden;
    }
    canvas {
      display: block;
      background-color: #1e1e2e;
    }
    footer {
      margin-top: 12px;
      font-size: 13px;
      color: #6c7086;
      display: flex;
      gap: 16px;
    }
    footer a {
      color: #89b4fa;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
    .controls-hint {
      margin-top: 6px;
      font-size: 12px;
      color: #f9e2af;
      background: rgba(249, 226, 175, 0.1);
      padding: 4px 12px;
      border-radius: 12px;
      border: 1px solid rgba(249, 226, 175, 0.2);
    }
  </style>
</head>
<body>
  <header>
    <h1>🐶 Dog Dash Deluxe (DDD)</h1>
    <p class="subtitle">2D Top-Down Side-Scrolling Runner & Auto-Shooter</p>
    <div class="controls-hint">Controls: W/A/S/D or Arrow Keys to move | Auto-Attacks Soundwave every 0.5s | ESC to reset</div>
  </header>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>

  <footer>
    <span>GitHub Pages Automated Deployment</span>
    <span>•</span>
    <a href="https://github.com/dolwijit13/dog-dash-drift" target="_blank" rel="noopener">Source Code</a>
  </footer>

  <script src="game.js"></script>
</body>
</html>
